name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Pinned instead of ubuntu-latest, which moves to Ubuntu 26 from October 19, 2026.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: morlana_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d morlana_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # morlana_ci is the empty database the migrations are checked against.
      # pytest never uses it: tests/conftest.py keeps the host and credentials
      # and always switches to its own database (morlana_test) and Redis db 15.
      DATABASE_URL: postgresql+psycopg://user:pass@localhost:5432/morlana_ci
      REDIS_URL: redis://localhost:6379/15
      TELEGRAM_BOT_TOKEN: "123456:TEST"
      DEV_MODE: "false"
      CORS_ORIGINS: http://localhost:3000
      LLM_API_KEY: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Migrate the empty database
        run: alembic upgrade head

      - name: Models match the migrations
        run: alembic check

      - name: Tests
        run: pytest -q

  frontend:
    # Pinned for the same reason as the backend job.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
