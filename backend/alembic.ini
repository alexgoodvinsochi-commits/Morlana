[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
# Same naming as the existing files in alembic/versions: 20260705_add_user_auth.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s
# Left empty on purpose: alembic/env.py takes the URL from settings.DATABASE_URL,
# so a migration can never hit a database other than the one the app is configured for.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
