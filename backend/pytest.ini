[pytest]
testpaths = tests
pythonpath = .
asyncio_mode = auto
# One event loop for the whole run: the app's SQLAlchemy engine is a module-level
# singleton, and its pooled connections cannot move between event loops.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
# The Docker image runs as a user that cannot write .pytest_cache into /app.
addopts = -p no:cacheprovider
