server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Tarot decks and backgrounds: immutable file names, safe to cache for a month.
    # ^~ so the static-extension regex below does not take over these blocks.
    location ^~ /decks/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /backgrounds/ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Vite build output (hashed names) - keeps its original short expiry.
    location ^~ /assets/ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Any other image/font asset served from the SPA root.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Append our own peer, so the backend's rate limiter can tell the entries
        # added by our proxies from the ones the client made up (rate_limiter.py).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;

        # SSE support (iOS/WebKit compatibility)
        proxy_set_header X-Accel-Buffering no;
        proxy_set_header Cache-Control no-cache;
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    # HTML shell / SPA fallback only - must never be cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
