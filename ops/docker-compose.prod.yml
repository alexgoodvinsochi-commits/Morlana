# Production overrides. On the server the stack runs as:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Nothing here changes local development: the base file stays untouched.
# `!override` replaces a list instead of appending to it (Compose v2.24+).

services:
  db:
    # Postgres must never be reachable from the internet. The compose network is
    # enough for the backend, and `docker compose exec` still works for admin.
    ports: !override []
    restart: unless-stopped
    logging: &json_logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    ports: !override []
    restart: unless-stopped
    logging: *json_logging

  migrate:
    logging: *json_logging

  backend:
    # Loopback only: reachable through the frontend container, plus from the host
    # for health checks. The host nginx is the single public entrance.
    ports: !override ["127.0.0.1:8000:8000"]
    # Reading state lives in Redis, not in process memory, so workers share
    # nothing and a second one is safe (CLAUDE.md, invariant on storage).
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
    restart: unless-stopped
    logging: *json_logging

  frontend:
    ports: !override ["127.0.0.1:3000:80"]
    restart: unless-stopped
    logging: *json_logging
