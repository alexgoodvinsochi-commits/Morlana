# Catch-all for the host nginx, installed by ops/install-host.sh. A request for the
# bare IP or for a name that is not ours is dropped. Without this block nginx serves
# the first site in sort order — dev.morlana.ru — to all of them.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Certificates are issued with "certonly --webroot -w /var/www/html" before a
    # name has a vhost of its own, so the challenge path has to answer here. Only
    # root, that is certbot, can write tokens into that directory.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 444;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    # There is no certificate for unknown names: refuse the handshake (nginx 1.19.4+).
    ssl_reject_handshake on;

    # The default server on a socket sets the TLS session context for every name
    # on it, so it repeats what the vhosts use.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # One of our names in SNI with a foreign Host header still lands here.
    return 444;
}
