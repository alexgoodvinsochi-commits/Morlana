# Host nginx: terminates TLS and hands everything to the compose stack on
# 127.0.0.1:3000, where the frontend container still serves the SPA and proxies
# /api/ to the backend. DOMAIN is replaced at install time.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # Keep plain HTTP for renewals only.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.24 on Ubuntu 24.04 has no standalone `http2 on;` directive: that
    # arrived in 1.25. Keep the parameter on listen until the server moves on.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN www.DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
    # Spelled out rather than included from certbot: the certificate is issued
    # with `certonly --webroot`, which never writes options-ssl-nginx.conf.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # No X-Frame-Options and no frame-ancestors on purpose: Telegram Web and
    # Desktop open a Mini App inside an iframe, and denying frames breaks them.

    client_max_body_size 2m;

    # Interpretation streams token by token over SSE. Any buffering on this path
    # collects the whole answer and delivers it in one lump, which looks like a
    # twenty-second freeze to the user (CLAUDE.md, task 6).
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends our own peer, so client_ip() in rate_limiter.py can walk the
        # list from the right and skip the hops we added ourselves.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
